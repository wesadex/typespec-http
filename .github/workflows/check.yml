# One job, one step per check: each check has its own status and log, and the
# tools are installed only once (the repo is private, so minutes count).
# Locally `mise run check` runs all of them.
name: Mise check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Pull request: compare with the target branch. Push to main: with main
      # before the push, so a push of several commits is checked as a whole.
      API_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      # easement and oasdiff write GitHub annotations on the changed lines.
      EASEMENT_FORMAT: github
      OASDIFF_FORMAT: githubactions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: betterleaks scans it, oasdiff and easement read the base from it.
          fetch-depth: 0
          persist-credentials: false

      # Installs the tools from mise.lock (checksums verified, --locked is automatic).
      - id: tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          # Same version as min_version in mise.toml: change both together.
          # No `sha256` on purpose: without it the action checks mise against
          # the signed release files, which is stronger than a plain hash.
          version: 2026.10.25
          install: true
          cache: true

      # Run every check even when an earlier one failed, but only if the tools
      # were installed. The job fails if any step failed.
      - name: gen:check
        run: mise run gen:check
      - name: lint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run lint
      - name: test
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run test
      - name: test:presence
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run test:presence
      - name: vuln
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run vuln
      - name: arch
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run arch
      - name: easement
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run easement
      - name: secrets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run secrets
      - name: api:breaking
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run api:breaking
      - name: spec:lint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run spec:lint
      - name: workflows
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run workflows
      - name: licenses
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run licenses
      - name: npm:audit
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: mise run npm:audit
