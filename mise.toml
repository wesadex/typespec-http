# Project toolchain. Works on macOS (arm64) and Debian Linux (x64, arm64).
# Exact versions and checksums for each platform are in mise.lock.
#
#   mise install      # install the tools below
#   mise run setup    # install npm packages (TypeSpec)

min_version = "2026.10.0"

[tools]
go = "1.27"
node = "26"
# Checkers: exact versions, so results do not change between machines.
golangci-lint = "2.15.0"
betterleaks = "1.9.0"
"github:oasdiff/oasdiff" = "1.35.0"
"github:fe3dback/go-arch-lint" = "1.19.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
# easement is young and changes fast: keep its rules in `warn` until it settles.
"github:mokevnin/easement" = "0.4.5"
"github:scip-code/scip-go" = "0.2.9"   # Go indexer that easement runs
"github:daveshanley/vacuum" = "0.36.2"  # OpenAPI linter
"github:rhysd/actionlint" = "1.7.12"    # GitHub Actions workflow linter
"github:zizmorcore/zizmor" = "1.31.1"   # GitHub Actions security linter
"go:github.com/google/go-licenses/v2" = "2.0.1"

[env]
# Make `tsp` and other npm binaries of this project available.
_.path = ["{{config_root}}/node_modules/.bin"]

[settings]
lockfile = true
# Keep mise.lock valid for every OS the team uses, not only the current one.
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tasks.setup]
description = "Install npm packages from package-lock.json"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci"

[tasks."spec:check"]
description = "Check the TypeSpec spec for errors, without writing files"
depends = ["setup"]
run = "tsp compile spec/main.tsp --no-emit --warn-as-error"

[tasks."spec:lint"]
description = "Lint the generated OpenAPI spec with vacuum (vacuum.yaml); warnings fail"
depends = ["gen:openapi"]
run = "vacuum lint --no-banner --no-style --details --fail-severity warn --ruleset vacuum.yaml api/openapi.yaml"

[tasks."gen:openapi"]
description = "Generate api/openapi.yaml from the TypeSpec spec"
depends = ["setup"]
sources = ["spec/**/*.tsp", "tspconfig.yaml", "package-lock.json"]
outputs = ["api/openapi.yaml"]
run = "tsp compile spec/main.tsp --config tspconfig.yaml --warn-as-error"

[tasks."gen:go"]
description = "Generate Go server code from api/openapi.yaml"
depends = ["gen:openapi"]
sources = ["api/openapi.yaml", "oapi-codegen.yaml", "go.mod"]
outputs = ["internal/api/api.gen.go"]
run = "go tool oapi-codegen -config oapi-codegen.yaml api/openapi.yaml"

[tasks.gen]
description = "Generate everything: OpenAPI from TypeSpec, then Go code"
depends = ["gen:go"]

[tasks.test]
description = "Run Go tests (race detector, random order) and fail below COVERAGE_MIN percent"
depends = ["gen"]
# Coverage counts hand-written code only: no generated code, no package main.
run = '''
min="${COVERAGE_MIN:-90}"
mkdir -p bin
go test -race -shuffle=on -count=1 -coverprofile=bin/coverage.out ./...
grep -v -e '/internal/api/' -e '/cmd/' bin/coverage.out > bin/coverage.app.out
go tool cover -func=bin/coverage.app.out > bin/coverage.txt
total="$(awk '/^total:/ { sub("%", "", $3); print $3 }' bin/coverage.txt)"
if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
  { echo "### Coverage: ${total}% (minimum ${min}%)"; echo '```'; cat bin/coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
fi
if ! awk -v t="$total" -v m="$min" 'BEGIN { exit !(t >= m) }'; then
  grep -v '100.0%$' bin/coverage.txt
  echo "test: coverage ${total}% is below ${min}%"
  exit 1
fi
echo "test: coverage ${total}% (minimum ${min}%)"
'''

[tasks."test:fuzz"]
description = "Run the fuzz tests for FUZZTIME each (default 30s); not part of check"
depends = ["gen"]
run = "go test -run '^$' -fuzz FuzzOrderAmount -fuzztime ${FUZZTIME:-30s} ./internal/httpapi/"

[tasks."test:presence"]
description = "Fail if a Go package has no tests (except package main and generated code)"
depends = ["gen"]
run = '''
{% raw %}
missing="$(go list -f '{{if and (ne .Name "main") (eq (len .TestGoFiles) 0) (eq (len .XTestGoFiles) 0)}}{{.ImportPath}}{{end}}' ./... | grep -v '/internal/api$' || true)"
{% endraw %}
if [ -n "$missing" ]; then
  echo "test:presence: these packages have no *_test.go:"
  echo "$missing"
  exit 1
fi
echo "test:presence: every package has tests"
'''

[tasks.build]
description = "Build the server binary to bin/orders"
depends = ["gen"]
run = "go build -o bin/orders ./cmd/orders"

[tasks.run]
description = "Run the server (ADDR=:8080 by default)"
depends = ["gen"]
run = "go run ./cmd/orders"

# ---- Checks. `mise run check` runs all of them; CI runs the same task. ----

[tasks.lint]
description = "Lint and format-check Go code"
depends = ["gen"]
run = ["golangci-lint fmt --diff", "golangci-lint run"]

[tasks.vuln]
description = "Find known vulnerabilities in code that is really called"
depends = ["gen"]
# Verbose: also list vulnerabilities in imported packages and required modules
# that the code does not call, so they can be updated early.
run = "govulncheck -show verbose ./..."

[tasks.arch]
description = "Check architecture rules from .go-arch-lint.yml"
run = "go-arch-lint check --output-color=false"

[tasks.easement]
description = "Check easement.yml rules and the ARCHITECTURE.md diagram (warnings only for now)"
depends = ["gen"]
# EASEMENT_FORMAT=github in CI shows the results on the changed lines of a pull request.
run = "easement check --color never --format ${EASEMENT_FORMAT:-text}"

[tasks.impact]
description = "List files that depend on what changed since API_BASE (default: main), to pick tests"
depends = ["gen"]
run = "easement impact --color never --diff ${API_BASE:-main}"

[tasks."api:breaking"]
description = "Fail on breaking API changes against API_BASE (default: main)"
depends = ["gen:openapi"]
run = '''
base="${API_BASE:-main}"
old="$(mktemp)"
trap 'rm -f "$old"' EXIT
if ! git show "$base:api/openapi.yaml" > "$old" 2>/dev/null; then
  echo "api:breaking: $base has no api/openapi.yaml yet, nothing to compare"
  exit 0
fi
# OASDIFF_FORMAT=githubactions in CI shows errors and warnings on the pull request.
oasdiff breaking "$old" api/openapi.yaml --fail-on ERR --format "${OASDIFF_FORMAT:-text}"
'''

[tasks."gen:check"]
description = "Fail if generated files or go.mod are stale or edited by hand"
run = '''
# Regenerate from scratch and compare with the files as they are now.
# The original files are put back, so this check never changes the tree.
before="$(mktemp -d)"
trap 'rm -rf "$before"' EXIT
mkdir -p "$before/spec" "$before/code"
cp -R api/. "$before/spec/"
cp -R internal/api/. "$before/code/"

mise run --force gen >/dev/null

stale=0
diff -ru "$before/spec" api || stale=1
diff -ru "$before/code" internal/api || stale=1
if [ "$stale" -ne 0 ]; then
  rm -rf api internal/api
  mkdir -p api internal/api
  cp -R "$before/spec/." api/
  cp -R "$before/code/." internal/api/
  echo "gen:check: generated files are stale or were edited by hand (diff above)."
  echo "Fix: change spec/main.tsp if needed, run 'mise run gen', commit the result."
  exit 1
fi
go mod tidy -diff
'''

[tasks.check]
description = "Run every check (CI runs each of them as a separate step)"
run = [
  "mise run gen:check",
  "mise run lint ::: test ::: test:presence ::: vuln ::: arch ::: easement ::: secrets ::: api:breaking ::: spec:lint ::: workflows ::: licenses ::: npm:audit",
]

[tasks.secrets]
description = "Find secrets in git history and in all files git sees (not ignored ones)"
run = [
  "betterleaks git --no-banner --redact .",
  "git ls-files -z -co --exclude-standard | xargs -0 betterleaks dir --no-banner --redact",
]

[tasks.workflows]
description = "Lint GitHub Actions workflows: actionlint for mistakes, zizmor for security"
run = ["actionlint", "zizmor --offline --no-progress .github/"]

[tasks.licenses]
description = "Fail if a Go dependency has a license outside the allowed list"
depends = ["gen"]
# Our own module has no license file, so it is ignored.
run = "go-licenses check ./... --ignore github.com/wesadex/typespec-http --allowed_licenses Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT"

[tasks."npm:audit"]
description = "Find known vulnerabilities in npm packages (TypeSpec, used only to generate code)"
depends = ["setup"]
run = "npm audit --audit-level=high"
