# Project toolchain. Works on macOS (arm64) and Debian Linux (x64, arm64).
# Exact versions and checksums for each platform are in mise.lock.
#
#   mise install      # install the tools below
#   mise run setup    # install npm packages (TypeSpec)

min_version = "2026.10.0"

[tools]
go = "1.27"
node = "26"
# Checkers: exact versions, so results do not change between machines.
golangci-lint = "2.15.0"
betterleaks = "1.9.0"
"github:oasdiff/oasdiff" = "1.35.0"
"github:fe3dback/go-arch-lint" = "1.19.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[env]
# Make `tsp` and other npm binaries of this project available.
_.path = ["{{config_root}}/node_modules/.bin"]

[settings]
lockfile = true
# Keep mise.lock valid for every OS the team uses, not only the current one.
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]

[tasks.setup]
description = "Install npm packages from package-lock.json"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci"

[tasks."spec:check"]
description = "Check the TypeSpec spec for errors, without writing files"
depends = ["setup"]
run = "tsp compile spec/main.tsp --no-emit --warn-as-error"

[tasks."gen:openapi"]
description = "Generate api/openapi.yaml from the TypeSpec spec"
depends = ["setup"]
sources = ["spec/**/*.tsp", "tspconfig.yaml", "package-lock.json"]
outputs = ["api/openapi.yaml"]
run = "tsp compile spec/main.tsp --config tspconfig.yaml --warn-as-error"

[tasks."gen:go"]
description = "Generate Go server code from api/openapi.yaml"
depends = ["gen:openapi"]
sources = ["api/openapi.yaml", "oapi-codegen.yaml", "go.mod"]
outputs = ["internal/api/api.gen.go"]
run = "go tool oapi-codegen -config oapi-codegen.yaml api/openapi.yaml"

[tasks.gen]
description = "Generate everything: OpenAPI from TypeSpec, then Go code"
depends = ["gen:go"]

[tasks.test]
description = "Run Go tests with the race detector"
depends = ["gen"]
run = "go test -race -count=1 ./..."

[tasks.build]
description = "Build the server binary to bin/orders"
depends = ["gen"]
run = "go build -o bin/orders ./cmd/orders"

[tasks.run]
description = "Run the server (ADDR=:8080 by default)"
depends = ["gen"]
run = "go run ./cmd/orders"

# ---- Checks. `mise run check` runs all of them; CI runs the same task. ----

[tasks.lint]
description = "Lint and format-check Go code"
depends = ["gen"]
run = ["golangci-lint fmt --diff", "golangci-lint run"]

[tasks.vuln]
description = "Find known vulnerabilities in code that is really called"
depends = ["gen"]
run = "govulncheck ./..."

[tasks.arch]
description = "Check architecture rules from .go-arch-lint.yml"
run = "go-arch-lint check --output-color=false"

[tasks."api:breaking"]
description = "Fail on breaking API changes against API_BASE (default: main)"
depends = ["gen:openapi"]
run = '''
base="${API_BASE:-main}"
old="$(mktemp)"
trap 'rm -f "$old"' EXIT
if ! git show "$base:api/openapi.yaml" > "$old" 2>/dev/null; then
  echo "api:breaking: $base has no api/openapi.yaml yet, nothing to compare"
  exit 0
fi
oasdiff breaking "$old" api/openapi.yaml --fail-on ERR
'''

[tasks."gen:check"]
description = "Fail if generated files or go.mod are stale or edited by hand"
run = '''
# Regenerate from scratch and compare with the files as they are now.
# The original files are put back, so this check never changes the tree.
before="$(mktemp -d)"
trap 'rm -rf "$before"' EXIT
mkdir -p "$before/spec" "$before/code"
cp -R api/. "$before/spec/"
cp -R internal/api/. "$before/code/"

mise run --force gen >/dev/null

stale=0
diff -ru "$before/spec" api || stale=1
diff -ru "$before/code" internal/api || stale=1
if [ "$stale" -ne 0 ]; then
  rm -rf api internal/api
  mkdir -p api internal/api
  cp -R "$before/spec/." api/
  cp -R "$before/code/." internal/api/
  echo "gen:check: generated files are stale or were edited by hand (diff above)."
  echo "Fix: change spec/main.tsp if needed, run 'mise run gen', commit the result."
  exit 1
fi
go mod tidy -diff
'''

[tasks.check]
description = "Run every check (the same as CI)"
run = [
  "mise run gen:check",
  "mise run lint ::: test ::: vuln ::: arch ::: secrets ::: api:breaking",
]

[tasks.secrets]
description = "Find secrets in git history and in all files git sees (not ignored ones)"
run = [
  "betterleaks git --no-banner --redact .",
  "git ls-files -z -co --exclude-standard | xargs -0 betterleaks dir --no-banner --redact",
]
