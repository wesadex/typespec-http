# Architecture rules, checked by `mise run arch`.
# Allowed imports go one way: cmd -> httpapi -> order <- storage.
# The domain (order) depends on nothing in the project.
version: 3

allow:
  depOnAnyVendor: false

# Tests may wire components together (for example httpapi tests use memory storage).
excludeFiles:
  - "^.*_test\\.go$"

components:
  main:    { in: cmd/** }
  api:     { in: internal/api }       # generated by oapi-codegen
  httpapi: { in: internal/httpapi }
  order:   { in: internal/order }
  storage: { in: internal/storage/** }

vendors:
  decimal:      { in: github.com/shopspring/decimal }
  openapi:      { in: github.com/getkin/kin-openapi/** }
  oapi-runtime: { in: [github.com/oapi-codegen/runtime, github.com/oapi-codegen/runtime/**] }
  validator:    { in: github.com/oapi-codegen/nethttp-middleware }

deps:
  main:
    mayDependOn: [httpapi, order, storage]
    canUse: [decimal]
  api:
    canUse: [openapi, oapi-runtime]
    # Generated code takes our handler as an interface; that is not a real dependency.
    deepScan: false
  httpapi:
    mayDependOn: [api, order]
    canUse: [openapi, validator]
  order:
    canUse: [decimal]
  storage:
    mayDependOn: [order]
